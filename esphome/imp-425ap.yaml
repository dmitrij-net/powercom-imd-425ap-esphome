esphome:
  name: imp-425ap
  friendly_name: UPS Powercom

esp8266:
  board: esp01_1m

# КРИТИЧЕСКИ ВАЖНО: Отключаем логи через UART (baud_rate: 0).
# Логирование будет работать только по сети Wi-Fi, чтобы не мешать общению с ИБП.
logger:
  baud_rate: 0

api:
  encryption:
    key: !secret imp_425ap__encryption_key
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: IMP-425AP
    password: p12345678

# Настройка UART
uart:
  id: ups_uart
  tx_pin: GPIO1  # Замените на ваш пин TX
  rx_pin: GPIO3  # Замените на ваш пин RX
  baud_rate: 1200
  data_bits: 8
  parity: NONE
  stop_bits: 1

# Выход для оптрона кнопки питания
# (инверсная логика: HIGH = оптрон выключен, LOW = нажатие)
output:
  - platform: gpio
    pin:
      number: GPIO2        
      inverted: true       # LOW активирует оптрон
    id: ups_power_optocoupler

globals:
  - id: ups_switch_locked_until
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: ups_manual_test_active
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: ups_next_poll_time
    type: uint32_t
    restore_value: no
    initial_value: '0'    

number:
  - platform: template
    name: "UPS Test Byte"
    id: ups_test_byte
    min_value: 0
    max_value: 255
    step: 1
    mode: box            # Отображает поле для ввода цифр, а не ползунок
    optimistic: true
    restore_value: true  # Запоминает последнее введенное значение после перезагрузки
    
# Кнопки
button:
  - platform: template
    name: "UPS Power Green Mode"
    id: ups_power_button
    icon: "mdi:power"
    on_press:
      - output.turn_on: ups_power_optocoupler
      - delay: 2500ms
      - output.turn_off: ups_power_optocoupler

  - platform: template
    name: "UPS Self-Test Button"
    id: ups_selftest_button
    icon: "mdi:test-tube"
    on_press:
      - logger.log: "Симуляция двойного клика (самотест)"
      - output.turn_on: ups_power_optocoupler
      - delay: 100ms
      - output.turn_off: ups_power_optocoupler
      - delay: 100ms
      - output.turn_on: ups_power_optocoupler
      - delay: 100ms
      - output.turn_off: ups_power_optocoupler

  - platform: template
    name: "UPS Send Test Byte"
    id: ups_send_test_byte
    icon: "mdi:send"
    on_press:
      - lambda: |-
          id(ups_manual_test_active) = true;
          ESP_LOGW("ups_test", "Отправка тестового байта: 0x%02X", (uint8_t) id(ups_test_byte).state);
      - uart.write:
          id: ups_uart
          data: !lambda |-
            return {(uint8_t) id(ups_test_byte).state};
      # Ждем ответа от ИБП (500 мс с запасом)
      - delay: 500ms
      - lambda: |-
          // Читаем всё, что пришло в ответ, и выводим в лог
          if (id(ups_uart).available() > 0) {
            ESP_LOGW("ups_test", "Получен ответ (%d байт):", id(ups_uart).available());
            while(id(ups_uart).available()) {
              uint8_t b;
              id(ups_uart).read_array(&b, 1);
              ESP_LOGW("ups_test", "  0x%02X", b);
            }
          } else {
            ESP_LOGW("ups_test", "Ответа нет (0 байт).");
          }
          // Снимаем паузу с основного цикла
          id(ups_manual_test_active) = false;

switch:
  - platform: template
    name: "UPS Power"
    id: ups_power_switch
    icon: "mdi:power"
    optimistic: false
    assumed_state: false
    turn_on_action:
      - logger.log: "Запрос: включить ИБП"
      - if:
          condition:
            and:
              - switch.is_off: ups_power_switch
              - lambda: 'return millis() > id(ups_switch_locked_until);'
          then:
            - lambda: |-
                id(ups_switch_locked_until) = millis() + 8000;
                id(ups_power_switch).publish_state(true);
                id(ups_next_poll_time) = millis() + 6000; 
            - output.turn_on: ups_power_optocoupler
            - delay: 4000ms
            - output.turn_off: ups_power_optocoupler
    turn_off_action:
      - logger.log: "Запрос: выключить ИБП"
      - if:
          condition:
            and:
              - switch.is_on: ups_power_switch
              - lambda: 'return millis() > id(ups_switch_locked_until);'
          then:
            - lambda: |-
                id(ups_switch_locked_until) = millis() + 8000;
                id(ups_power_switch).publish_state(false);
                id(ups_next_poll_time) = millis() + 5000;
            - output.turn_on: ups_power_optocoupler
            - delay: 3000ms
            - output.turn_off: ups_power_optocoupler   

# Сенсоры
sensor:
  - platform: template
    name: "UPS Load"
    id: ups_load
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    name: "UPS Battery"
    id: ups_battery
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    name: "UPS Input Voltage"
    id: ups_input_voltage
    unit_of_measurement: "V"
    accuracy_decimals: 1
    update_interval: never
  - platform: template
    name: "UPS Output Voltage"
    id: ups_output_voltage
    unit_of_measurement: "V"
    accuracy_decimals: 1
    update_interval: never
  - platform: template
    name: "UPS Input Frequency"
    id: ups_input_freq
    unit_of_measurement: "Hz"
    accuracy_decimals: 1
    update_interval: never
  - platform: template
    name: "UPS Output Frequency"
    id: ups_output_freq
    unit_of_measurement: "Hz"
    accuracy_decimals: 1
    update_interval: never

# Бинарные сенсоры для статусов
binary_sensor:
  - platform: template
    name: "UPS AC Power Lost"
    id: ups_ac_power_lost
    icon: "mdi:power-plug-off"
    device_class: problem
  - platform: template
    name: "UPS Low Battery"
    id: ups_low_battery
  - platform: template
    name: "UPS Overload"
    id: ups_overload
  - platform: template
    name: "UPS Input Voltage Low"
    id: ups_voltage_low
    icon: "mdi:arrow-down-bold"
    device_class: problem
  - platform: template
    name: "UPS Input Voltage High"
    id: ups_voltage_high
    icon: "mdi:arrow-up-bold"
    device_class: problem
  # --- Неизвестные биты 9-го байта (резерв) ---
  - platform: template
    name: "UPS Status Bit 5 (Reserved)"
    id: ups_status_bit5
  - platform: template
    name: "UPS Status Bit 7 (Reserved)"
    id: ups_status_bit7
  - platform: template
    name: "UPS Status Bit 8 (Reserved)"
    id: ups_status_bit8
  - platform: template
    name: "UPS Self-Test"
    id: ups_self_test
    icon: "mdi:test-tube"
  - platform: template
    name: "UPS Beeper Muted"
    id: ups_beeper_muted
    icon: "mdi:volume-off"
  - platform: template
    name: "UPS Green Mode"
    id: ups_green_mode
    icon: "mdi:leaf"

# Текстовые сенсоры
text_sensor:
  - platform: template
    name: "UPS Raw Packet (HEX)"
    id: ups_raw_packet
    icon: "mdi:memory"
  - platform: template
    name: "UPS Unknown Bytes"
    id: ups_unknown_bytes
    icon: "mdi:help-circle-outline"
    
# Логика опроса и парсинга
interval:
  - interval: 1s
    then:
      - if:
          condition:
            lambda: 'return !id(ups_manual_test_active) && (millis() >= id(ups_next_poll_time));'
          then:
            # 1. Проверяем, нет ли асинхронных байтов от ИБП
            - lambda: |-
                if (id(ups_uart).available() > 0) {
                  ESP_LOGW("ups_async", "Асинхронный пакет: %d байт", id(ups_uart).available());
                  while (id(ups_uart).available()) {
                    uint8_t b;
                    id(ups_uart).read_array(&b, 1);
                    ESP_LOGW("ups_async", "  0x%02X", b);
                  }
                }
            
            # 2. Отправляем запрос 0x01
            - uart.write: 
                id: ups_uart
                data: [0x01]
            
            # 3. Ждем немного, чтобы ИБП успел ответить
            - delay: 150ms
            
            # 4. Читаем и парсим ответ
            - lambda: |-      
                if (id(ups_uart).available() >= 16) {
                  uint8_t data[16];
                  if (id(ups_uart).read_array(data, 16)) {
                    
                    // --- Основные сенсоры ---
                    id(ups_load).publish_state(data[0]);
                    id(ups_battery).publish_state(data[1]);
                    id(ups_input_voltage).publish_state(data[2] * 2.0);
                    id(ups_output_voltage).publish_state(data[3] * 2.0);
                    id(ups_input_freq).publish_state(data[4]);
                    id(ups_output_freq).publish_state(data[6]);
                    
                    // --- 9-й байт статуса ---
                    uint8_t status = data[9];
                    id(ups_ac_power_lost).publish_state((status & 0x01) != 0);
                    id(ups_low_battery).publish_state((status & 0x02) != 0);
                    id(ups_voltage_low).publish_state((status & 0x04) != 0);
                    id(ups_voltage_high).publish_state((status & 0x08) != 0);
                    id(ups_overload).publish_state((status & 0x20) != 0);
                    id(ups_status_bit5).publish_state((status & 0x10) != 0);
                    id(ups_status_bit7).publish_state((status & 0x40) != 0);
                    id(ups_status_bit8).publish_state((status & 0x80) != 0);
                    
                    // --- Байт 10 (data[10]) ---
                    uint8_t mode = data[10];
                    id(ups_self_test).publish_state((mode & 0x04) != 0);
                    id(ups_beeper_muted).publish_state((mode & 0x08) != 0);
                    id(ups_green_mode).publish_state((mode & 0x40) == 0);
                    
                    // --- Состояние питания ИБП ---
                    if (millis() > id(ups_switch_locked_until)) {
                      id(ups_power_switch).publish_state(true);
                    }
                    
                    // --- HEX-строка ---
                    char hex_buf[64];
                    snprintf(hex_buf, sizeof(hex_buf),
                      "%02X %02X %02X %02X %02X %02X %02X %02X %02X %02X %02X %02X %02X %02X %02X %02X",
                      data[0], data[1], data[2],  data[3],  data[4],  data[5],  data[6],  data[7],
                      data[8], data[9], data[10], data[11], data[12], data[13], data[14], data[15]);
                    
                    static std::string last_hex = "";
                    if (last_hex != hex_buf) {
                      id(ups_raw_packet).publish_state(hex_buf);
                      last_hex = hex_buf;
                      ESP_LOGD("ups", "Пакет изменился: %s", hex_buf);
                    }
                    
                    // --- Неизвестные байты ---
                    char unknown_buf[64];
                    snprintf(unknown_buf, sizeof(unknown_buf),
                      "5:%02X 7:%02X 8:%02X 10:%02X 11:%02X 12:%02X 13:%02X 14:%02X 15:%02X",
                      data[5], data[7], data[8],
                      data[10], data[11], data[12], data[13], data[14], data[15]);
                    
                    static std::string last_unknown = "";
                    if (last_unknown != unknown_buf) {
                      id(ups_unknown_bytes).publish_state(unknown_buf);
                      last_unknown = unknown_buf;
                    }
                    
                    // === УСПЕХ: ИБП ответил ===
                    id(ups_next_poll_time) = millis() + 2000;
                    
                  } else {
                    ESP_LOGW("ups", "Ошибка чтения 16 байт из UART");
                    id(ups_next_poll_time) = millis() + 30000;
                    while(id(ups_uart).available()) { 
                      uint8_t dummy;
                      id(ups_uart).read_array(&dummy, 1);
                    }
                  }
                } else {
                  ESP_LOGW("ups", "Недостаточно данных: %d байт", id(ups_uart).available());
                  // Помечаем числовые сенсоры как недоступные
                  id(ups_load).publish_state(NAN);
                  id(ups_battery).publish_state(NAN);
                  id(ups_input_voltage).publish_state(NAN);
                  id(ups_output_voltage).publish_state(NAN);
                  id(ups_input_freq).publish_state(NAN);
                  id(ups_output_freq).publish_state(NAN);

                  // Очищаем состояния бинарных сенсоров (статусы)
                  id(ups_ac_power_lost).invalidate_state();
                  id(ups_low_battery).invalidate_state();
                  id(ups_overload).invalidate_state();
                  id(ups_voltage_low).invalidate_state();
                  id(ups_voltage_high).invalidate_state();
                  id(ups_status_bit5).invalidate_state();
                  id(ups_status_bit7).invalidate_state();
                  id(ups_status_bit8).invalidate_state();
                  id(ups_self_test).invalidate_state();
                  id(ups_beeper_muted).invalidate_state();
                  id(ups_green_mode).invalidate_state();

                  // Очищаем текстовые сенсоры
                  id(ups_raw_packet).publish_state("");
                  id(ups_unknown_bytes).publish_state("");
                  
                  // === СБОЙ: ИБП не ответил ===
                  id(ups_next_poll_time) = millis() + 30000;
                  if (millis() > id(ups_switch_locked_until)) {
                    id(ups_power_switch).publish_state(false);
                  }
                  while(id(ups_uart).available()) { 
                    uint8_t dummy;
                    id(ups_uart).read_array(&dummy, 1);
                  }
                }
